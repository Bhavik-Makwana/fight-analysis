[project]
name = "fight-analysis"
version = "0.1.0"
description = "Computer-vision + VLM-labelled analysis of a Muay Thai bout from phone footage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lap>=0.5.14",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.213",
]

[project.optional-dependencies]
label = [
    "anthropic>=2.8.0",
    "openai>=3.51.0",
]
